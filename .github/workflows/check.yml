name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: grid-test-only
          POSTGRES_DB: grid_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- lib/index.js lib/client.js
      - run: pnpm test
      - run: mkdir -p docs/evidence
      - run: pnpm test:pg
        env:
          PG_GRID_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
